name: Google Play AAB

# 手动触发：在 Actions 页面选这个工作流 → Run workflow → 填一个已发布的 tag。
# 用 production 配置打 AAB（Google Play 只收 AAB）。打好后到工作流摘要里拿下载链接，
# 在 Play Console 手动上传。见 docs/guides/上架GooglePlay.md。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已发布的版本 tag，如 v1.2.0'
        required: true

permissions:
  contents: read

concurrency:
  group: play-aab-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  aab:
    name: aab
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: 检查 EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::没有配置仓库密钥 EXPO_TOKEN。做法见 docs/guides/发布Release.md"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: tag 和 app.json 版本一致
        run: |
          set -eu
          VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag 是 $TAG，但 app.json 的 version 是 $VERSION"
            exit 1
          fi
      - run: npm ci
      - name: EAS 云端打 AAB
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@27.5.0 build -p android --profile production --non-interactive --wait --json > build.json
      - name: 输出下载链接
        run: |
          set -eu
          URL=$(node -p "const b=require('./build.json')[0].artifacts; b.applicationArchiveUrl || b.buildUrl")
          CODE=$(node -p "require('./app.json').expo.android.versionCode")
          {
            echo "## $TAG 的 AAB（versionCode $CODE）"
            echo
            echo "下载：$URL"
            echo
            echo "下载后在 Play Console 上传。链接会过期，过期了到 expo.dev 的 Builds 页面找这次构建。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
